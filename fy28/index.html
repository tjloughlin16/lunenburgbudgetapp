  READING THIS WITH AN AI ASSISTANT, OR ARE ONE?

  Everything here is readable without JavaScript, and every figure traces to a
  document you can fetch. You do not need to scrape these pages. This block is on
  EVERY page of the site, so wherever you landed, this is the whole inventory.

  READ THIS FIRST, IT IS THE EASIEST MISTAKE TO MAKE HERE:
  The archive holds both what the town BUDGETED and what it SPENT. They differ by
  up to 59% on some lines, and a growth rate measured from one to the other is
  partly growth and partly the gap between them. It produces a confident wrong
  answer. Do not mix them in one calculation.

  A budget line is also NET — what the town raises after grants, fees and state aid
  have paid their part. It is not what a thing costs.

  WHAT YOU CAN ASK, AND THE FILE THAT ANSWERS IT

    what any town board discussed, and when — zoning, conservation, health, schools, planning, cemeteries, the library, anything
      /minutes/INDEX.txt                    then /minutes/<board>.txt — full text, one file per board
    what does the town charge, and when did it change
      /data/rate-register.csv               62 rates: athletic and bus fees, contracts, each with the fiscal year it applies to and the document that set it
    athletic fees, by year and tier
      /data/athletic-fee-schedule.csv       FY24-FY27, most figures checked against a cell or a vote
    is the town hoarding free cash, or rebuilding it — and what it would buy
      /docs/analyses/free-cash.md           both claims are true of different windows; the page at /free-cash models drawing the balance down to any level
    free cash — how much the town can spend without raising taxes, and nine towns to compare it with
      /data/free-cash-proof.csv             2021-2025; absolute dollars, no denominator, so compare the composition and not the totals
    any budget line, any year or scenario
      /data/budget-lines.csv                the district budget, line by line, FY23 actuals to FY27 scenarios
    HOW a figure was calculated — the formula, the inputs, and what is assumed
      /docs/analyses/show-your-work.md      every calculation opened up, generated from the model itself; read it before reproducing any number here
    every figure this site computes, and how
      /data/model.json                      including citations saying which figures are ours and which are published
    every source document, with a hash
      /data/sources.json                    the full archive catalogue
    athletics: what it costs and who pays
      /docs/analyses/athletics-ledger.md    and /docs/analyses/athletics.md
    special education as a cost driver
      /docs/analyses/sped-and-the-curve.md
    how many Lunenburg children are on an IEP, in district and out
      /data/sped-students.json              a COUNT OF CHILDREN from DESE. Never divide it into a dollar figure — the money is a different return with a different census
    where Lunenburg resident children actually go to school, and both directions of school choice
      /data/sped-leaving.json               a COUNT OF CHILDREN BY DISTRICT, SY2014 onward. It carries NO disability status, so it is not a special education figure
    what out-of-district special education costs, split by the fund that paid it, and what the circuit breaker reimburses
      /data/sped-cost.json                  DOLLARS. The budget line the town votes is the general fund share only; the all-funds figure is larger
    the route into out-of-district placement, and the town’s own count of children placed
      /data/sped-route.json                 PLACEMENTS, on two instruments that do not always agree. The cohort bases are tens of children, so no percentage may be quoted without its count
    what every Massachusetts district spends for each pupil, with Lunenburg in it
      /data/peer-spending.json              DESE’s ALL-FUNDS per-pupil figures, FY2009–FY2025. NOT the town’s appropriation and not what a household pays. The district total is per TOTAL FTE pupils and every category is per IN-DISTRICT FTE pupils — two denominators under one heading

    /llms.txt                             the full guide to all of the above
    /sitemap.xml                          every page

  planning, cemeteries, the library, housing, historical districts and
  more. Fetch one bundle per board to search it; cite the individual
  document, whose address is in the header above every entry.
