<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 756 352' width='756' height='352' role='img' aria-label='Eight correlations across the 161 Massachusetts towns that run their own K-12 district, drawn as signed bars. The strongest is income per capita → tax bill at +0.92; the weakest is new growth → tax bill at -0.03.' font-family='system-ui, -apple-system, sans-serif'>
<rect width='756' height='352' fill='#ffffff'/>
<text x='10' y='24' font-size='15' font-weight='700' fill='#111827'>What actually moves a tax bill</text>
<text x='10' y='42' font-size='11.5' fill='#4b5563'>Correlation across the 161 towns that run their own K–12 district. Tax figures FY2026, school figures SY2025.</text>
<text x='10' y='60' font-size='10.5' fill='#6b7280'>A bar to the right is a positive relationship, to the left negative. Neither says which way causation runs.</text>
<line x1='480' y1='82' x2='480' y2='322' stroke='#9ca3af' stroke-width='1'/>
<text x='284' y='90.0' font-size='11.5' fill='#374151' text-anchor='end'>average home value → tax bill</text>
<rect x='480.0' y='80.0' width='164.2' height='13' rx='2' fill='#1d4ed8' fill-opacity='0.85'/>
<text x='674' y='90.0' font-size='11' font-weight='600' fill='#111827'>+0.91</text>
<text x='284' y='120.0' font-size='11.5' fill='#374151' text-anchor='end'>income per capita → tax bill</text>
<rect x='480.0' y='110.0' width='165.0' height='13' rx='2' fill='#1d4ed8' fill-opacity='0.85'/>
<text x='674' y='120.0' font-size='11' font-weight='600' fill='#111827'>+0.92</text>
<text x='284' y='150.0' font-size='11.5' fill='#374151' text-anchor='end'>per-pupil spending → tax bill</text>
<rect x='480.0' y='140.0' width='51.9' height='13' rx='2' fill='#1d4ed8' fill-opacity='0.85'/>
<text x='674' y='150.0' font-size='11' font-weight='600' fill='#111827'>+0.29</text>
<text x='284' y='180.0' font-size='11.5' fill='#374151' text-anchor='end'>overrides won → tax bill</text>
<rect x='480.0' y='170.0' width='110.2' height='13' rx='2' fill='#1d4ed8' fill-opacity='0.85'/>
<text x='674' y='180.0' font-size='11' font-weight='600' fill='#111827'>+0.61</text>
<text x='284' y='210.0' font-size='11.5' fill='#374151' text-anchor='end'>commercial share → tax bill</text>
<rect x='412.1' y='200.0' width='67.9' height='13' rx='2' fill='#be123c' fill-opacity='0.85'/>
<text x='674' y='210.0' font-size='11' font-weight='600' fill='#111827'>-0.38</text>
<text x='284' y='240.0' font-size='11.5' fill='#374151' text-anchor='end'>commercial share → new growth</text>
<rect x='480.0' y='230.0' width='74.3' height='13' rx='2' fill='#1d4ed8' fill-opacity='0.85'/>
<text x='674' y='240.0' font-size='11' font-weight='600' fill='#111827'>+0.41</text>
<text x='284' y='270.0' font-size='11.5' fill='#374151' text-anchor='end'>new growth → tax bill</text>
<rect x='475.1' y='260.0' width='4.9' height='13' rx='2' fill='#be123c' fill-opacity='0.85'/>
<text x='674' y='270.0' font-size='11' font-weight='600' fill='#111827'>-0.03</text>
<text x='284' y='300.0' font-size='11.5' fill='#374151' text-anchor='end'>enrolment change → per-pupil growth</text>
<rect x='379.8' y='290.0' width='100.2' height='13' rx='2' fill='#be123c' fill-opacity='0.85'/>
<text x='674' y='300.0' font-size='11' font-weight='600' fill='#111827'>-0.56</text>
</svg>
