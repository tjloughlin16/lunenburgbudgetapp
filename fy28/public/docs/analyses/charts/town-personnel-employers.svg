<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 258" width="756"
 height="258" role="img" aria-label="How many people each part of the town employs. Every part of the town that publishes a staff count. Four do; the other departments publish none, and their staff are in no figure here."
 font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="756" height="258" fill="#fcfcfb"/>
<g transform="translate(18,18)">
<text x="0" y="15" font-size="13" font-weight="700" fill="#0b0b0b">How many people each part of the town employs</text>
<text x="0" y="31" font-size="10.5" fill="#52514e">Every part of the town that publishes a staff count. Four do; the other departments publish none, and their staff are in no figure here.</text>
<rect x="200" y="65.0" width="352.4" height="22" fill="#184f95" rx="2"/><text x="192" y="80.0" font-size="11" text-anchor="end" fill="#0b0b0b">Schools</text><text x="560.4" y="80.0" font-size="11" font-weight="700" fill="#0b0b0b">250</text><text x="560.4" y="94.0" font-size="9.5" fill="#2a8c6a">+34 since FY2011</text><rect x="200" y="111.0" width="56.4" height="22" fill="#184f95" rx="2"/><text x="192" y="126.0" font-size="11" text-anchor="end" fill="#0b0b0b">Fire Department</text><text x="264.4" y="126.0" font-size="11" font-weight="700" fill="#0b0b0b">40</text><text x="264.4" y="140.0" font-size="9.5" fill="#e08214">−5 since FY2017</text><rect x="200" y="157.0" width="35.2" height="22" fill="#184f95" rx="2"/><text x="192" y="172.0" font-size="11" text-anchor="end" fill="#0b0b0b">Police Department</text><text x="243.2" y="172.0" font-size="11" font-weight="700" fill="#0b0b0b">25</text><text x="243.2" y="186.0" font-size="9.5" fill="#2a8c6a">+3 since FY2021</text><rect x="200" y="203.0" width="19.7" height="22" fill="#184f95" rx="2"/><text x="192" y="218.0" font-size="11" text-anchor="end" fill="#0b0b0b">Department Of Public Works</text><text x="227.7" y="218.0" font-size="11" font-weight="700" fill="#0b0b0b">14</text><text x="227.7" y="232.0" font-size="9.5" fill="#898781">+0 since FY2023</text>
</g>
</svg>
