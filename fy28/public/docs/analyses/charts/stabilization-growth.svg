<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 304" width="676"
 height="304" role="img" aria-label="How fast each fund moved, per year. Between each fund’s first and last reading — the span differs per fund and is printed on each"
 font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect width="676" height="304" fill="#fcfcfb"/>
<g transform="translate(18,18)">
<text x="0" y="15" font-size="13" font-weight="700" fill="#0b0b0b">How fast each fund moved, per year</text>
<text x="0" y="31" font-size="10.5" fill="#52514e">Between each fund’s first and last reading — the span differs per fund and is printed on each</text>
<text x="0" y="66" font-size="11" font-weight="600" fill="#e08214">Vehicle/Equipment</text><text x="0" y="80" font-size="9" fill="#898781">FY2018–FY2025, 7 years, 4 proven readings</text><rect x="200" y="56" width="310.0" height="20" fill="#e08214" rx="2"/><text x="518.0" y="70.5" font-size="12" font-weight="700" fill="#0b0b0b">40.8% a year</text><text x="200" y="90" font-size="9.5" fill="#52514e">$236k → $2.60M</text><text x="0" y="118" font-size="11" font-weight="600" fill="#184f95">Stabilization (general)</text><text x="0" y="132" font-size="9" fill="#898781">FY2016–FY2025, 9 years, 5 proven readings</text><rect x="200" y="108" width="64.4" height="20" fill="#184f95" rx="2"/><text x="272.4" y="122.5" font-size="12" font-weight="700" fill="#0b0b0b">8.5% a year</text><text x="200" y="142" font-size="9.5" fill="#52514e">$1.51M → $3.15M</text><text x="0" y="170" font-size="11" font-weight="600" fill="#2a8c6a">Zoning Incentive</text><text x="0" y="184" font-size="9" fill="#898781">FY2014–FY2025, 11 years, 7 proven readings</text><rect x="200" y="160" width="6.4" height="20" fill="#2a8c6a" rx="2"/><text x="214.4" y="174.5" font-size="12" font-weight="700" fill="#0b0b0b">0.8% a year</text><text x="200" y="194" font-size="9.5" fill="#52514e">$227k → $249k</text><text x="0" y="246" font-size="9.5" fill="#898781">The balance’s movement, not a rate of return: these funds rise when Town Meeting votes money in AND when they earn interest,</text><text x="0" y="258" font-size="9.5" fill="#898781">and nothing in this data separates the two.</text>
</g>
</svg>
