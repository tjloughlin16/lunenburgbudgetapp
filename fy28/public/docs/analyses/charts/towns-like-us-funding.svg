<text x='10' y='40' font-size='11.5' fill='#4b5563'>Pupils, then dollars spent on each pupil, split by source. Sorted by how much a town spends ABOVE the figure the state calculates for it.</text>
<text x='10' y='56' font-size='10.5' fill='#6b7280'>The local requirement is split between homes and business by each town’s own tax base — exact where one rate applies to all property, approximate where a town splits its rate.</text>
