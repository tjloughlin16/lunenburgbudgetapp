<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 756 564' width='756' height='564' role='img' aria-label='For each town, how many pupils it has and what it spends on each of them, split into what the town must raise from homes, what it raises from business, what the state adds, and what it spends above the state’s own figure. Lunenburg spends $3,838 above that figure; the largest here is $12,451.' font-family='system-ui, -apple-system, sans-serif'>
