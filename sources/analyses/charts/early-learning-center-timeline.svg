<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" role="img" aria-label="The Early Learning Center in the documents">
<rect width="900" height="644" fill="#ffffff"/>
<text x="16" y="24" font-size="14" font-weight="700" fill="#1f2328">The Early Learning Center in the documents</text>
<circle cx="21" cy="44" r="5" fill="#2b6cb0"/><text x="30" y="48" font-size="10.5" fill="#5b6470">where it was housed</text>
<circle cx="166" cy="44" r="5" fill="#7c3aed"/><text x="175" y="48" font-size="10.5" fill="#5b6470">run by the schools</text>
<circle cx="311" cy="44" r="5" fill="#0f766e"/><text x="320" y="48" font-size="10.5" fill="#5b6470">handbooks</text>
<circle cx="456" cy="44" r="5" fill="#b45309"/><text x="465" y="48" font-size="10.5" fill="#5b6470">rates</text>
<circle cx="601" cy="44" r="5" fill="#be185d"/><text x="610" y="48" font-size="10.5" fill="#5b6470">separate from preschool</text>
<circle cx="746" cy="44" r="5" fill="#15803d"/><text x="755" y="48" font-size="10.5" fill="#5b6470">how it is paid for</text>
<line x1="110" y1="62" x2="110" y2="600" stroke="#d8dbe0" stroke-width="2"/>
<text x="96" y="74" font-size="11" text-anchor="end" fill="#5b6470">FY2012</text>
<circle cx="110" cy="70" r="6" fill="#2b6cb0"/>
<text x="126" y="74" font-size="11" font-weight="700" fill="#1f2328">Annual town report</text>
<text x="126" y="87" font-size="10.5" fill="#5b6470">The earliest mention we hold: a staff post named for the ELC, and the programme housed at the T.C. Passios ...</text>
<text x="96" y="108" font-size="11" text-anchor="end" fill="#5b6470">2018-11-07</text>
<circle cx="110" cy="104" r="6" fill="#7c3aed"/>
<text x="126" y="108" font-size="11" font-weight="700" fill="#1f2328">Select Board</text>
<text x="126" y="121" font-size="10.5" fill="#5b6470">The Superintendent lists the ELC and Extended Day among the district’s programmes while discussing space fo...</text>
<text x="96" y="142" font-size="11" text-anchor="end" fill="#5b6470">2019-05-07</text>
<circle cx="110" cy="138" r="6" fill="#be185d"/>
<text x="126" y="142" font-size="11" font-weight="700" fill="#1f2328">Select Board</text>
<text x="126" y="155" font-size="10.5" fill="#5b6470">The Town Manager reports the ELC will move to T.C. Passios, and distinguishes it from the integrated presch...</text>
<text x="96" y="176" font-size="11" text-anchor="end" fill="#5b6470">2021-10-20</text>
<circle cx="110" cy="172" r="6" fill="#b45309"/>
<text x="126" y="176" font-size="11" font-weight="700" fill="#1f2328">School Committee agenda, filed under advisory councils</text>
<text x="126" y="189" font-size="10.5" fill="#5b6470">A proposed Extended Day and ELC rate increase is on the agenda.</text>
<text x="96" y="210" font-size="11" text-anchor="end" fill="#5b6470">2022-03-16</text>
<circle cx="110" cy="206" r="6" fill="#0f766e"/>
<text x="126" y="210" font-size="11" font-weight="700" fill="#1f2328">School Committee (agenda)</text>
<text x="126" y="223" font-size="10.5" fill="#5b6470">Extended Day and ELC recommendations and handbooks are on the agenda.</text>
<text x="96" y="244" font-size="11" text-anchor="end" fill="#5b6470">2022-05-16</text>
<circle cx="110" cy="240" r="6" fill="#2b6cb0"/>
<text x="126" y="244" font-size="11" font-weight="700" fill="#1f2328">Municipal Building Design Committee</text>
<text x="126" y="257" font-size="10.5" fill="#5b6470">The teen center is ruled out as a home for the ELC because of its play equipment.</text>
<text x="96" y="278" font-size="11" text-anchor="end" fill="#5b6470">2022-12-20</text>
<circle cx="110" cy="274" r="6" fill="#2b6cb0"/>
<text x="126" y="278" font-size="11" font-weight="700" fill="#1f2328">Select Board</text>
<text x="126" y="291" font-size="10.5" fill="#5b6470">The School Committee asks for the Brooks House as an ELC; the design committee expects the programmes to re...</text>
<text x="96" y="312" font-size="11" text-anchor="end" fill="#5b6470">2023-03-01</text>
<circle cx="110" cy="308" r="6" fill="#0f766e"/>
<text x="126" y="312" font-size="11" font-weight="700" fill="#1f2328">School Committee (agenda)</text>
<text x="126" y="325" font-size="10.5" fill="#5b6470">Extended Day and ELC handbooks are on the agenda for action.</text>
<text x="96" y="346" font-size="11" text-anchor="end" fill="#5b6470">2024-02-28</text>
<circle cx="110" cy="342" r="6" fill="#be185d"/>
<text x="126" y="346" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="359" font-size="10.5" fill="#5b6470">Pre-K registration and ELC registration open on different dates, as separate programmes.</text>
<text x="96" y="380" font-size="11" text-anchor="end" fill="#5b6470">2024-05-01</text>
<circle cx="110" cy="376" r="6" fill="#0f766e"/>
<text x="126" y="380" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="393" font-size="10.5" fill="#5b6470">The Director presents the Extended Day and ELC handbooks: no price or policy changes.</text>
<text x="96" y="414" font-size="11" text-anchor="end" fill="#5b6470">2025-03-19</text>
<circle cx="110" cy="410" r="6" fill="#0f766e"/>
<text x="126" y="414" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="427" font-size="10.5" fill="#5b6470">The FY2026 handbooks move the ELC to the Primary School.</text>
<text x="96" y="448" font-size="11" text-anchor="end" fill="#5b6470">2025-03-19</text>
<circle cx="110" cy="444" r="6" fill="#15803d"/>
<text x="126" y="448" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="461" font-size="10.5" fill="#5b6470">The committee adopts the unaffiliated salary schedule, described as mostly Extended Day and ELC staff paid ...</text>
<text x="96" y="482" font-size="11" text-anchor="end" fill="#5b6470">2025-09-03</text>
<circle cx="110" cy="478" r="6" fill="#be185d"/>
<text x="126" y="482" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="495" font-size="10.5" fill="#5b6470">The Primary School reports its enrolment as not including the ELC.</text>
<text x="96" y="516" font-size="11" text-anchor="end" fill="#5b6470">2025-11-20</text>
<circle cx="110" cy="512" r="6" fill="#2b6cb0"/>
<text x="126" y="516" font-size="11" font-weight="700" fill="#1f2328">Library Board of Trustees</text>
<text x="126" y="529" font-size="10.5" fill="#5b6470">The library’s preschool storytime loses the ELC children after the move.</text>
<text x="96" y="550" font-size="11" text-anchor="end" fill="#5b6470">2026-03-18</text>
<circle cx="110" cy="546" r="6" fill="#0f766e"/>
<text x="126" y="550" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="563" font-size="10.5" fill="#5b6470">The FY2027 Extended Day and ELC handbooks are approved; the ELC stays at the Primary School.</text>
<text x="96" y="584" font-size="11" text-anchor="end" fill="#5b6470">2026-09-09</text>
<circle cx="110" cy="580" r="6" fill="#be185d"/>
<text x="126" y="584" font-size="11" font-weight="700" fill="#1f2328">School Committee</text>
<text x="126" y="597" font-size="10.5" fill="#5b6470">Preschool and ELC children start together, the week after kindergarten.</text>
</svg>
